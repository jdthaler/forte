name: native

# The C++ side (native/, docs/PLUGINS.md): the plugins built and validated on macOS, Windows and
# Linux, and the WebAssembly rebuilt with the pinned Emscripten.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAP_VALIDATOR: '0.4.1'

jobs:
  plugins:
    name: plugins (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: linux }
          - { os: macos-15, preset: macos }
          - { os: windows-2022, preset: windows }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages (the standalone's audio and MIDI, the window and its web view)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libx11-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Ninja
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja

      # A compiler cache, so a change recompiles only what it touches instead of every
      # instrument's plugins and the SDKs from scratch. The Ninja presets only: the Visual Studio
      # generator (windows) takes no compiler launcher.
      - name: ccache
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y ccache; else command -v ccache || brew install ccache; fi
          for lang in C CXX OBJC OBJCXX; do echo "CMAKE_${lang}_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"; done
          { echo "CCACHE_DIR=$RUNNER_TEMP/ccache"; echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"; echo "CCACHE_MAXSIZE=500M"; } >> "$GITHUB_ENV"
      - name: Cache the compiler's output
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-

      - name: Cache the fetched dependencies
        uses: actions/cache@v4
        with:
          path: native/build/${{ matrix.preset }}/_deps/*-src
          key: deps-${{ matrix.preset }}-${{ hashFiles('native/cmake/dependencies.cmake') }}

      - name: Configure
        working-directory: native
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        working-directory: native
        run: |
          command -v ccache >/dev/null && ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }} --parallel
      - name: ccache statistics
        if: runner.os != 'Windows'
        run: |
          ccache --show-stats
          { echo '### ccache (${{ matrix.preset }})'; echo '```'; ccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests
        working-directory: native
        run: ctest --preset ${{ matrix.preset }}

      - name: Ad-hoc signing (macOS)
        if: runner.os == 'macOS'
        run: |
          find native/build/macos/plugins -maxdepth 1 \( -name '*.clap' -o -name '*.vst3' -o -name '*.component' -o -name '*.app' \) \
            -exec codesign --force --deep --sign - {} \;

      - name: Cache clap-validator
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/clap-validator*
          key: clap-validator-${{ runner.os }}-${{ env.CLAP_VALIDATOR }}
      - name: clap-validator
        run: |
          command -v clap-validator || cargo install --locked --git https://github.com/free-audio/clap-validator --tag "$CLAP_VALIDATOR" clap-validator
          find native/build/${{ matrix.preset }}/plugins -name '*.clap' -prune -print0 |
            while IFS= read -r -d '' p; do echo "== $p"; clap-validator validate "$p" || exit 1; done

      - name: VST3 validator
        run: |
          cmake --build native/build/${{ matrix.preset }} --target vst3_validator --config Release
          v=$(find native/build/${{ matrix.preset }}/validator-build/bin -type f \( -name validator -o -name validator.exe \) | head -1)
          find native/build/${{ matrix.preset }}/plugins -name '*.vst3' -prune -print0 |
            while IFS= read -r -d '' p; do echo "== $p"; "$v" "$p" || exit 1; done

      - name: auval (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          for p in native/build/macos/plugins/*.component; do
            cp -R "$p" ~/Library/Audio/Plug-Ins/Components/
            plist="$p/Contents/Info.plist"
            type=$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:type' "$plist")
            sub=$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:subtype' "$plist")
            manu=$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:manufacturer' "$plist")
            killall -9 AudioComponentRegistrar || true
            echo "== $p ($type $sub $manu)"
            auval -strict -v "$type" "$sub" "$manu"
          done

      - name: Keep the plugins (to try in a DAW)
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.preset }}
          path: |
            native/build/${{ matrix.preset }}/plugins
            !native/build/${{ matrix.preset }}/plugins/**/*.pdb
          retention-days: 14

      # What a release ships (the release-plugins workflow attaches these): every instrument's
      # plugins together and each one's alone, without the template's, with native/INSTALL.md,
      # in archives that keep the bundles' executable bits and the macOS signatures (the
      # artifact above loses both).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package the plugins for a release
        run: tools/package-plugins.sh ${{ matrix.preset }}
      - name: The download's Makefile installs and verifies every plugin
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/try"
          if [ "$RUNNER_OS" = macOS ]; then ditto -x -k dist/Forte-plugins-macos.zip "$RUNNER_TEMP/try"
          else tar -xzf dist/Forte-plugins-linux.tar.gz -C "$RUNNER_TEMP/try"; fi
          cd "$RUNNER_TEMP/try/Forte plugins"
          make check
          make install
          make verify
          make uninstall
          # one format alone, and the standalone checked where it was unpacked, quarantined as a
          # browser's download would be
          make install-clap
          make verify-clap
          if make verify-vst3; then echo '::error::make verify-vst3 passed with no VST3 installed'; exit 1; fi
          make uninstall-clap
          if [ "$RUNNER_OS" = macOS ]; then
            for a in *.app; do xattr -w com.apple.quarantine '0083;00000000;Safari;' "$a"; done
            if make check-app; then echo '::error::make check-app passed a quarantined app'; exit 1; fi
            for a in *.app; do xattr -dr com.apple.quarantine "$a"; done
          fi
          make check-app
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.preset }}
          path: dist/*
          compression-level: 0
          retention-days: 30

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Emscripten (the version in native/emscripten-version)
        run: |
          v=$(cat native/emscripten-version)
          git clone --depth 1 --branch "$v" https://github.com/emscripten-core/emsdk "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$v"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$v"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          sudo apt-get install -y ninja-build
      - name: Build
        working-directory: native
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --preset wasm
          cmake --build --preset wasm --parallel
      - name: Unit tests (in Node)
        working-directory: native
        run: ctest --preset wasm
      - name: The committed WebAssembly is what this source builds
        run: |
          git status --porcelain
          git diff --exit-code -- '*.wasm' || { echo "::error::Rebuild the WebAssembly (native/README.md) and commit it."; exit 1; }
      - name: The ported instruments' test suites and references, on the WebAssembly
        env:
          FORTE_ENGINE: wasm
          CI: 1
        run: |
          for d in native/instruments/*/; do s=$(basename "$d"); echo "== $s"; node tools/test-all.mjs "$s-tests"; done
          node test/native-tests.mjs
