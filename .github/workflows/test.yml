name: tests

on:
  push:
  pull_request:

# A newer push to a branch or pull request replaces its run still going; every run on main and live finishes.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/live' }}

jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base branch, for the pull-request rules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Into main: no version changes, and a note in changes/ when the site or the plugins change.
      # Into live: the release has been made (no notes left). changes/README.md, CLAUDE.md.
      - name: Versions and release notes
        if: github.event_name == 'pull_request'
        run: node tools/release.mjs --check-pr "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
      - run: npm test

  # Every page at the phone, tablet and desktop sizes in headless Chromium (tools/check-pages.mjs):
  # no errors, nothing scrolling sideways, the controls in their places. On a pull request, also
  # every count that differs from its base, in the job's summary.
  pages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base branch, for the comparison
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright and Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Check every page
        run: |
          set -o pipefail
          node tools/check-pages.mjs ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }} | tee "$RUNNER_TEMP/pages.txt"
      - name: Summary
        if: always()
        run: |
          { echo '### Pages'; echo '```'; grep -E '^(FAIL|DIFF|  )|passed|differ|counts the same' "$RUNNER_TEMP/pages.txt" | head -200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
